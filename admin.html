<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rozgar PK - Admin Panel</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#F8FAFC; padding:20px; color:#1E293B; }
.header{ background:#1E3A5F; color:white; padding:20px; border-radius:15px; text-align:center; margin-bottom:20px; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin-bottom:20px; }
.card{ background:white; padding:20px; border-radius:15px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.card h2{ font-size:30px; color:#1E3A5F; margin-bottom:10px; }
.section{ background:white; padding:20px; border-radius:15px; margin-bottom:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.section-title { font-size:18px; color:#1E3A5F; margin-bottom:15px; padding-bottom:8px; border-bottom:2px solid #F1F5F9; display:flex; align-items:center; justify-content:space-between; }
.worker{ padding:15px; border-bottom:1px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.worker:last-child{ border-bottom:none; }
.worker-info{ flex:1; min-width:200px; }
.action-btns{ display:flex; gap:8px; }
.btn{ display:inline-block; background:#1E3A5F; color:white; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:13px; font-weight:bold; cursor:pointer; border:none; }
.btn-verify{ background:#22C55E; }
.btn-delete{ background:#EF4444; }
.btn-unverify{ background:#F59E0B; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; }
.badge-verified { background:#DCFCE7; color:#15803D; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:bold; }
.badge-pending { background:#FEF3C7; color:#D97706; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:bold; }
.empty-text { color:#64748B; font-size:14px; text-align:center; padding:10px; }
</style>
</head>
<body>

<div class="header">
  <h1>🔑 Rozgar PK Admin Panel</h1>
  <p>Manage Workers & Verification</p>
</div>

<div class="stats">
  <div class="card">
    <h2 id="pendingCount">0</h2>
    <p>Pending Verification</p>
  </div>
  <div class="card">
    <h2 id="verifiedCount">0</h2>
    <p>Verified Workers</p>
  </div>
  <div class="card">
    <h2 id="totalJobs">0</h2>
    <p>Total Jobs</p>
  </div>
</div>

<div class="section">
  <div class="section-title">
    <span>⚠️ Pending Verification Workers</span>
  </div>
  <div id="unverifiedList">Loading...</div>
</div>

<div class="section">
  <div class="section-title">
    <span>✅ Verified Workers</span>
  </div>
  <div id="verifiedList">Loading...</div>
</div>

<div class="section">
  <h2>Quick Links</h2>
  <a href="dashboard.html" class="btn">Workers Dashboard</a>
  <a href="jobs.html" class="btn">Jobs List</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD13C2N3R6b-lgr7HXipEicQKr7AinbHPA",
  authDomain: "rozgarconnect-69054.firebaseapp.com",
  projectId: "rozgarconnect-69054",
  storageBucket: "rozgarconnect-69054.firebasestorage.app",
  messagingSenderId: "260861416467",
  appId: "1:260861416467:web:0e5ba645c9301a53b79be6",
  measurementId: "G-P9HZ0BM40W"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function escapeHTML(str) {
  return (str || "").replace(/[&<>'"]/g, 
    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
  );
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    loadAdminData();
  } else {
    window.location.href = "login.html";
  }
});

async function loadAdminData(){
  try{
    const usersSnapshot = await getDocs(collection(db,"users"));
    const jobsSnapshot = await getDocs(collection(db,"jobs"));
    
    let pendingWorkers = 0;
    let verifiedWorkers = 0;

    const unverifiedList = document.getElementById("unverifiedList");
    const verifiedList = document.getElementById("verifiedList");

    unverifiedList.innerHTML = "";
    verifiedList.innerHTML = "";

    usersSnapshot.forEach((docRef)=>{
      const user = docRef.data();
      const userId = docRef.id;

      if(user.role === "worker"){
        const isVerified = user.isVerified === true;
        const name = escapeHTML(user.name || "Worker");
        const city = escapeHTML(user.city || "City Not Added");
        const skill = escapeHTML(user.skill || "Skill Not Added");
        const mobile = escapeHTML(user.mobile || "");

        if(!isVerified) {
          pendingWorkers++;
          unverifiedList.innerHTML += `
            <div class="worker" id="worker-${userId}">
              <div class="worker-info">
                <b>${name}</b> <span class="badge-pending">Pending</span><br>
                📍 ${city}<br>
                🛠 ${skill}<br>
                📞 ${mobile}
              </div>
              <div class="action-btns">
                <button class="btn btn-verify" onclick="toggleVerification('${userId}', true, this)">✅ Approve & Verify</button>
                <button class="btn btn-delete" onclick="deleteWorker('${userId}', this)">🗑️ Delete</button>
              </div>
            </div>
          `;
        } else {
          verifiedWorkers++;
          verifiedList.innerHTML += `
            <div class="worker" id="worker-${userId}">
              <div class="worker-info">
                <b>${name}</b> <span class="badge-verified">✅ Verified</span><br>
                📍 ${city}<br>
                🛠 ${skill}<br>
                📞 ${mobile}
              </div>
              <div class="action-btns">
                <button class="btn btn-unverify" onclick="toggleVerification('${userId}', false, this)">⚠️ Remove Badge</button>
                <button class="btn btn-delete" onclick="deleteWorker('${userId}', this)">🗑️ Delete</button>
              </div>
            </div>
          `;
        }
      }
    });

    document.getElementById("pendingCount").innerText = pendingWorkers;
    document.getElementById("verifiedCount").innerText = verifiedWorkers;
    document.getElementById("totalJobs").innerText = jobsSnapshot.size;

    if(pendingWorkers === 0){
      unverifiedList.innerHTML = '<div class="empty-text">No pending verification requests 🎉</div>';
    }

    if(verifiedWorkers === 0){
      verifiedList.innerHTML = '<div class="empty-text">No verified workers yet</div>';
    }

  }catch(error){
    console.error("Admin Load Error:", error);
    document.getElementById("unverifiedList").innerHTML = "Error loading data: " + error.message;
    document.getElementById("verifiedList").innerHTML = "Error loading data: " + error.message;
  }
}

window.toggleVerification = async function(userId, status, btnElement) {
  if (btnElement) btnElement.disabled = true;
  try {
    const userRef = doc(db, "users", userId);
    await updateDoc(userRef, {
      isVerified: status
    });
    alert(status ? "Worker Verified successfully! 🎉" : "Verification removed.");
    await loadAdminData();
  } catch (error) {
    console.error("Verification toggle failed:", error);
    alert("Permission Error: Please update your Firebase Rules!\n\nDetails: " + error.message);
  } finally {
    if (btnElement) btnElement.disabled = false;
  }
};

window.deleteWorker = async function(userId, btnElement) {
  if (confirm("Are you sure you want to permanently delete this worker profile?")) {
    if (btnElement) btnElement.disabled = true;
    try {
      const userRef = doc(db, "users", userId);
      await deleteDoc(userRef);
      alert("Worker profile deleted.");
      await loadAdminData();
    } catch (error) {
      console.error("Delete worker failed:", error);
      alert("Delete failed: " + error.message);
    } finally {
      if (btnElement) btnElement.disabled = false;
    }
  }
};
</script>

</body>
</html>
