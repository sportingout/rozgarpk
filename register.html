<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozgar PK - Create Account</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Background Glowing Bubbles Animation */
.bg-bubble-1, .bg-bubble-2 {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  z-index: 0;
  animation: pulseGlow 4s ease-in-out infinite alternate;
}

.bg-bubble-1 {
  width: 200px;
  height: 200px;
  background: #2563eb;
  top: 10%;
  left: 10%;
}

.bg-bubble-2 {
  width: 220px;
  height: 220px;
  background: #f59e0b;
  bottom: 10%;
  right: 10%;
  animation-delay: 2s;
}

@keyframes pulseGlow {
  0% { transform: scale(1) translateY(0); opacity: 0.6; }
  100% { transform: scale(1.2) translateY(-20px); opacity: 0.9; }
}

/* Card Entrance Animation */
.register-container {
  width: 100%;
  max-width: 420px;
  background: #1e293b;
  padding: 30px 25px;
  border-radius: 16px;
  border: 1px solid #334155;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 1;
  transform: translateY(20px);
  opacity: 0;
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

h2 {
  text-align: center;
  color: #ffffff;
  font-size: 24px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 13px;
  color: #94a3b8;
}

input, select {
  width: 100%;
  padding: 12px;
  background: #0f172a;
  border: 1.5px solid #334155;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

select option {
  background: #1e293b;
  color: #fff;
}

input:focus, select:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
}

.submit-btn {
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.2s ease;
}

.submit-btn:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
}

.submit-btn:active {
  transform: translateY(0);
}

.login-link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  color: #94a3b8;
}

.login-link a {
  color: #22c55e;
  text-decoration: none;
  font-weight: bold;
}

.login-link a:hover {
  text-decoration: underline;
}

/* Worker Fields Smooth Dropdown Animation */
#workerFields {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: all 0.4s ease-in-out;
}

#workerFields.visible-fields {
  max-height: 300px;
  opacity: 1;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="bg-bubble-1"></div>
<div class="bg-bubble-2"></div>

<div class="register-container">
<h2>Create Account</h2>
<form id="registerForm">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="regName" placeholder="e.g., Ali Khan" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" id="regEmail" placeholder="e.g., ali@email.com" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="regPassword" placeholder="Minimum 6 characters" required>
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="regMobile" placeholder="e.g., 03216543210" required>
</div>

<div class="form-group">
<label>City / Area</label>
<input type="text" id="regCity" placeholder="e.g., Multan Cantt, Lahore" required>
</div>

<div class="form-group">
<label>Account Type (Role)</label>
<select id="regRole" required>
<option value="" disabled selected>Are you an Owner or Worker?</option>
<option value="owner">Owner (Kaam Karwana Hai)</option>
<option value="worker">Worker (Kaam Dhondna Hai)</option>
</select>
</div>

<!-- Animated Smooth Worker Extra Fields -->
<div id="workerFields">
<div class="form-group">
<label>Your Skill</label>
<input type="text" id="regSkill" placeholder="e.g., Car Mechanic, Plumber, Mason">
</div>
<div class="form-group">
<label>Daily Wage (Rs.)</label>
<input type="number" id="regWage" placeholder="e.g., 1500">
</div>
<div class="form-group">
<label>Experience (Years)</label>
<input type="text" id="regExperience" placeholder="e.g., 5 Years">
</div>
</div>

<button type="submit" class="submit-btn">Create Account</button>
</form>

<div class="login-link">
Already have an account? <a href="login.html">Login Here</a>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyD13C2N3R6b-lgr7HXipEicQKr7AinbHPA",
authDomain: "rozgarconnect-69054.firebaseapp.com",
projectId: "rozgarconnect-69054",
storageBucket: "rozgarconnect-69054.firebasestorage.app",
messagingSenderId: "260861416467",
appId: "1:260861416467:web:0e5ba645c9301a53b79be6",
measurementId: "G-HQN19GD8DR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const roleSelect = document.getElementById("regRole");
const workerFields = document.getElementById("workerFields");
const regSkill = document.getElementById("regSkill");
const regWage = document.getElementById("regWage");
const regExperience = document.getElementById("regExperience");

// TOGGLE HANDLER WITH SMOOTH HEIGHT ANIMATION
roleSelect.addEventListener("change", function() {
    if (this.value === "worker") {
        workerFields.classList.add("visible-fields");
        regSkill.required = true;
        regWage.required = true;
        regExperience.required = true;
    } else {
        workerFields.classList.remove("visible-fields");
        regSkill.required = false;
        regWage.required = false;
        regExperience.required = false;
        
        regSkill.value = "";
        regWage.value = "";
        regExperience.value = "";
    }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
e.preventDefault();

const name = document.getElementById("regName").value;
const email = document.getElementById("regEmail").value;
const password = document.getElementById("regPassword").value;
const mobile = document.getElementById("regMobile").value;
const city = document.getElementById("regCity").value;
const role = roleSelect.value;

try {
const userCredential = await createUserWithEmailAndPassword(auth, email, password);
const user = userCredential.user;

const userData = {
uid: user.uid,
name: name,
email: email,
mobile: mobile,
city: city,
role: role,
isVerified: false,
availability: "Available"
};

if (role === "worker") {
    userData.skill = regSkill.value; 
    userData.wage = regWage.value;
    userData.experience = regExperience.value;
    userData.rating = 0;
    userData.totalStars = 0;
    userData.reviewCount = 0;
    userData.imageUrl = "";
} else {
    userData.skill = "N/A";
    userData.wage = "0";
    userData.experience = "N/A";
}

await setDoc(doc(db, "users", user.uid), userData);

alert("Account Created Successfully!");
window.location.href = "dashboard.html";

} catch (error) {
console.error("Signup Error:", error);
alert("Error creating account: " + error.message);
}
});
</script>

</body>
</html>
