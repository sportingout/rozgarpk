<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozgar PK - Create Account</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
  position: relative;
}

/* Background Animated Glowing Circles */
body::before, body::after {
  content: '';
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  filter: blur(90px);
  z-index: 0;
  animation: floatBG 6s ease-in-out infinite alternate;
}
body::before {
  background: #f59e0b;
  top: 5%;
  right: 10%;
}
body::after {
  background: #0d6efd;
  bottom: 5%;
  left: 10%;
  animation-delay: -3s;
}

@keyframes floatBG {
  0% { transform: translateY(0px) scale(1); }
  100% { transform: translateY(-30px) scale(1.1); }
}

/* Main Container Entrance Animation */
.register-container {
  width: 100%;
  max-width: 440px;
  background: rgba(22, 27, 34, 0.85);
  backdrop-filter: blur(12px);
  padding: 35px 25px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
  z-index: 1;
  animation: containerAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes containerAppear {
  0% {
    opacity: 0;
    transform: translateY(30px) scale(0.95);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

h2 {
  text-align: center;
  color: #ffffff;
  font-size: 24px;
  margin-bottom: 20px;
  letter-spacing: 0.5px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 13px;
  color: #8b949e;
}

input, select {
  width: 100%;
  padding: 12px 15px;
  background: rgba(13, 17, 23, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

select option {
  background: #161b22;
  color: #fff;
}

input:focus, select:focus {
  border-color: #f59e0b;
  box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
  background: rgba(13, 17, 23, 0.9);
}

.submit-btn {
  width: 100%;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(245, 158, 11, 0.5);
}

.submit-btn:active {
  transform: translateY(0);
}

.login-link {
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
  color: #8b949e;
}

.login-link a {
  color: #22C55E;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s ease;
}

.login-link a:hover {
  text-decoration: underline;
}

/* Dynamic Hidden/Visible Toggle Classes */
.hidden-fields {
  display: none !important;
}
.visible-fields {
  display: block !important;
  animation: fadeIn 0.4s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="register-container">
<h2>Create Account</h2>
<form id="registerForm">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="regName" placeholder="e.g., Ali Khan" required>
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="regEmail" placeholder="e.g., ali@email.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="regPassword" placeholder="Minimum 6 characters" required>
</div>
<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="regMobile" placeholder="e.g., 03216543210" required>
</div>
<div class="form-group">
<label>City / Area</label>
<input type="text" id="regCity" placeholder="e.g., Multan Cantt, Lahore" required>
</div>

<div class="form-group">
<label>Account Type (Role)</label>
<select id="regRole" required>
<option value="" disabled selected>Are you an Owner or Worker?</option>
<option value="owner">Owner (Kaam Karwana Hai)</option>
<option value="worker">Worker (Kaam Dhondna Hai)</option>
</select>
</div>

<div id="workerFields" class="hidden-fields">
<div class="form-group">
<label>Your Skill</label>
<input type="text" id="regSkill" placeholder="e.g., Car Mechanic, Plumber, Mason">
</div>
<div class="form-group">
<label>Daily Wage (Rs.)</label>
<input type="number" id="regWage" placeholder="e.g., 1500">
</div>
<div class="form-group">
<label>Experience (Years)</label>
<input type="text" id="regExperience" placeholder="e.g., 5 Years">
</div>
</div>

<button type="submit" class="submit-btn">Create Account</button>
</form>

<div class="login-link">
Already have an account? <a href="login.html">Login Here</a>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyD13C2N3R6b-lgr7HXipEicQKr7AinbHPA",
authDomain: "rozgarconnect-69054.firebaseapp.com",
projectId: "rozgarconnect-69054",
storageBucket: "rozgarconnect-69054.firebasestorage.app",
messagingSenderId: "260861416467",
appId: "1:260861416467:web:0e5ba645c9301a53b79be6",
measurementId: "G-P9HZ0BM40W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const roleSelect = document.getElementById("regRole");
const workerFields = document.getElementById("workerFields");
const regSkill = document.getElementById("regSkill");
const regWage = document.getElementById("regWage");
const regExperience = document.getElementById("regExperience");

// STABLE TOGGLE HANDLER
roleSelect.addEventListener("change", function() {
    if (this.value === "worker") {
        workerFields.className = "visible-fields";
        regSkill.required = true;
        regWage.required = true;
        regExperience.required = true;
    } else {
        workerFields.className = "hidden-fields";
        regSkill.required = false;
        regWage.required = false;
        regExperience.required = false;
        
        // Reset inputs values
        regSkill.value = "";
        regWage.value = "";
        regExperience.value = "";
    }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
e.preventDefault();

const name = document.getElementById("regName").value;
const email = document.getElementById("regEmail").value;
const password = document.getElementById("regPassword").value;
const mobile = document.getElementById("regMobile").value;
const city = document.getElementById("regCity").value;
const role = roleSelect.value;

try {
const userCredential = await createUserWithEmailAndPassword(auth, email, password);
const user = userCredential.user;

const userData = {
uid: user.uid,
name: name,
email: email,
mobile: mobile,
city: city,
role: role,
isVerified: false,
availability: "Available"
};

if (role === "worker") {
    userData.skill = regSkill.value; 
    userData.wage = regWage.value;
    userData.experience = regExperience.value;
    userData.rating = 0;
    userData.totalStars = 0;
    userData.reviewCount = 0;
    userData.imageUrl = "";
} else {
    userData.skill = "N/A";
    userData.wage = "0";
    userData.experience = "N/A";
}

await setDoc(doc(db, "users", user.uid), userData);

alert("Account Created Successfully!");
window.location.href = "dashboard.html";

} catch (error) {
console.error("Signup Error:", error);
alert("Error creating account: " + error.message);
}
});
</script>

</body>
</html>
