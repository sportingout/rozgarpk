<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozgar PK - Create Account</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#F8FAFC;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}
.register-container{
background:white;
padding:25px;
border-radius:20px;
width:100%;
max-width:400px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}
h2{
color:#1E3A5F;
text-align:center;
margin-bottom:20px;
}
.form-group{
margin-bottom:15px;
}
label{
display:block;
margin-bottom:5px;
font-weight:bold;
font-size:14px;
color:#475569;
}
input, select{
width:100%;
padding:12px;
border:1px solid #CBD5E1;
border-radius:10px;
font-size:15px;
background: white;
}
.submit-btn{
width:100%;
padding:14px;
background:#1E3A5F;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
.login-link{
text-align:center;
margin-top:15px;
font-size:14px;
}
.login-link a{
color:#22C55E;
text-decoration:none;
font-weight:bold;
}

/* Stable visible/invisible classes */
.hidden-fields {
    display: none !important;
}
.visible-fields {
    display: block !important;
}
</style>
</head>
<body>

<div class="register-container">
<h2>Create Account</h2>
<form id="registerForm">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="regName" placeholder="e.g., Ali Khan" required>
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="regEmail" placeholder="e.g., ali@email.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="regPassword" placeholder="Minimum 6 characters" required>
</div>
<div class="form-group">
<label>Mobile Number</label>
<input type="tel" id="regMobile" placeholder="e.g., 03216543210" required>
</div>
<div class="form-group">
<label>City / Area</label>
<input type="text" id="regCity" placeholder="e.g., Multan Cantt, Lahore" required>
</div>

<div class="form-group">
<label>Account Type (Role)</label>
<select id="regRole" required>
<option value="" disabled selected>Are you an Owner or Worker?</option>
<option value="owner">Owner (Kaam Karwana Hai)</option>
<option value="worker">Worker (Kaam Dhondna Hai)</option>
</select>
</div>

<div id="workerFields" class="hidden-fields">
<div class="form-group">
<label>Your Skill</label>
<input type="text" id="regSkill" placeholder="e.g., Car Mechanic, Plumber, Mason">
</div>
<div class="form-group">
<label>Daily Wage (Rs.)</label>
<input type="number" id="regWage" placeholder="e.g., 1500">
</div>
<div class="form-group">
<label>Experience (Years)</label>
<input type="text" id="regExperience" placeholder="e.g., 5 Years">
</div>
</div>

<button type="submit" class="submit-btn">Create Account</button>
</form>

<div class="login-link">
Already have an account? <a href="login.html">Login Here</a>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyD13C2N3R6b-lgr7HXipEicQKr7AinbHPA",
authDomain: "rozgarconnect-69054.firebaseapp.com",
projectId: "rozgarconnect-69054",
storageBucket: "rozgarconnect-69054.firebasestorage.app",
messagingSenderId: "260861416467",
appId: "1:260861416467:web:0e5ba645c9301a53b79be6",
measurementId: "G-P9HZ0BM40W"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const roleSelect = document.getElementById("regRole");
const workerFields = document.getElementById("workerFields");
const regSkill = document.getElementById("regSkill");
const regWage = document.getElementById("regWage");
const regExperience = document.getElementById("regExperience");

// STABLE TOGGLE HANDLER
roleSelect.addEventListener("change", function() {
    if (this.value === "worker") {
        workerFields.className = "visible-fields";
        regSkill.required = true;
        regWage.required = true;
        regExperience.required = true;
    } else {
        workerFields.className = "hidden-fields";
        regSkill.required = false;
        regWage.required = false;
        regExperience.required = false;
        
        // Reset inputs values
        regSkill.value = "";
        regWage.value = "";
        regExperience.value = "";
    }
});

document.getElementById("registerForm").addEventListener("submit", async (e) => {
e.preventDefault();

const name = document.getElementById("regName").value;
const email = document.getElementById("regEmail").value;
const password = document.getElementById("regPassword").value;
const mobile = document.getElementById("regMobile").value;
const city = document.getElementById("regCity").value;
const role = roleSelect.value;

try {
const userCredential = await createUserWithEmailAndPassword(auth, email, password);
const user = userCredential.user;

const userData = {
uid: user.uid,
name: name,
email: email,
mobile: mobile,
city: city,
role: role,
isVerified: false,
availability: "Available"
};

if (role === "worker") {
    userData.skill = regSkill.value; 
    userData.wage = regWage.value;
    userData.experience = regExperience.value;
    userData.rating = 0;
    userData.totalStars = 0;
    userData.reviewCount = 0;
    userData.imageUrl = "";
} else {
    userData.skill = "N/A";
    userData.wage = "0";
    userData.experience = "N/A";
}

await setDoc(doc(db, "users", user.uid), userData);

alert("Account Created Successfully!");
window.location.href = "dashboard.html";

} catch (error) {
console.error("Signup Error:", error);
alert("Error creating account: " + error.message);
}
});
</script>

</body>
</html>
