<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozgar PK - Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Background Glowing Bubbles Animation */
.bg-bubble-1, .bg-bubble-2 {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  z-index: 0;
  animation: pulseGlow 4s ease-in-out infinite alternate;
}

.bg-bubble-1 {
  width: 200px;
  height: 200px;
  background: #2563eb;
  top: 15%;
  left: 10%;
}

.bg-bubble-2 {
  width: 220px;
  height: 220px;
  background: #22c55e;
  bottom: 15%;
  right: 10%;
  animation-delay: 2s;
}

@keyframes pulseGlow {
  0% { transform: scale(1) translateY(0); opacity: 0.6; }
  100% { transform: scale(1.2) translateY(-20px); opacity: 0.9; }
}

/* Card Entrance Animation */
.login-container {
  width: 100%;
  max-width: 400px;
  background: #1e293b;
  padding: 30px 25px;
  border-radius: 16px;
  border: 1px solid #334155;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 1;
  transform: translateY(20px);
  opacity: 0;
  animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideUp {
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

h2 {
  text-align: center;
  color: #ffffff;
  font-size: 24px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 13px;
  color: #94a3b8;
}

input[type="email"], input[type="password"] {
  width: 100%;
  padding: 12px;
  background: #0f172a;
  border: 1.5px solid #334155;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
}

.remember-box {
  display: flex;
  align-items: center;
  margin: 10px 0 18px 0;
  color: #94a3b8;
  font-size: 13px;
  cursor: pointer;
}

.remember-box input {
  width: 16px;
  height: 16px;
  accent-color: #2563eb;
  margin-right: 8px;
  cursor: pointer;
}

.submit-btn {
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.submit-btn:hover {
  background: #1d4ed8;
  transform: translateY(-2px);
}

.submit-btn:active {
  transform: translateY(0);
}

.register-link {
  text-align: center;
  margin-top: 18px;
  font-size: 14px;
  color: #94a3b8;
}

.register-link a {
  color: #22c55e;
  text-decoration: none;
  font-weight: bold;
}

.register-link a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="bg-bubble-1"></div>
<div class="bg-bubble-2"></div>

<div class="login-container">
<h2>Rozgar PK Login</h2>

<form id="loginForm">
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="e.g., ali@email.com" required>
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password" required>
  </div>

  <div class="remember-box">
    <input type="checkbox" id="rememberMe">
    <label for="rememberMe">Remember Me</label>
  </div>

  <button type="submit" id="loginBtn" class="submit-btn">Login</button>
</form>

<div class="register-link">
  Don't have an account? <a href="register.html">Create New Account</a>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD13C2N3R6b-lgr7HXipEicQKr7AinbHPA",
  authDomain: "rozgarconnect-69054.firebaseapp.com",
  projectId: "rozgarconnect-69054",
  storageBucket: "rozgarconnect-69054.firebasestorage.app",
  messagingSenderId: "260861416467",
  appId: "1:260861416467:web:0e5ba645c9301a53b79be6",
  measurementId: "G-HQN19GD8DR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const loginBtn = document.getElementById("loginBtn");

  try {
    loginBtn.innerText = "Logging in...";
    loginBtn.disabled = true;

    await signInWithEmailAndPassword(auth, email, password);
    
    alert("Login Successful!");
    window.location.href = "dashboard.html";
  } catch (error) {
    console.error("Login Error:", error);
    alert("Error: " + error.message);
    loginBtn.innerText = "Login";
    loginBtn.disabled = false;
  }
});
</script>

</body>
</html>
